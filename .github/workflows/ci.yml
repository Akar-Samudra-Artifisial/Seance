# Build, check and test Séance on every push and pull request to main.
# No secrets, no real kiro-cli: the runner tests use the Fake_Agent from apps/runner/test/fixtures,
# and the opt-in real-Kiro test stays off (SEANCE_E2E_KIRO is never set here). The rootless-Podman
# sandbox suite (apps/ircd/test/runner/sandbox.integration.test.ts) skips itself unless rootless
# Podman 5 and the pinned base image are present; this job never pulls or builds that image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Belt and braces: the real-Kiro end-to-end test must never run in CI.
      SEANCE_E2E_KIRO: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # pnpm version comes from "packageManager": "pnpm@11.7.0" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (version from .nvmrc) with the pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: The web production build exists
        run: |
          if [ ! -f apps/web/.next/BUILD_ID ]; then
            echo "::error::apps/web/.next/BUILD_ID is missing after pnpm build"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The bundle check needs both builds (.next and .next-e2e). The e2e build only exists after
      # the Playwright step, so the bundle test runs on its own further down with CI=true, where a
      # missing build output fails instead of skipping.
      - name: Unit, property and integration tests
        run: pnpm test --concurrency=1
        env:
          CI: "false"

      - name: Install Playwright Chromium
        run: pnpm --filter @seance/web exec playwright install --with-deps chromium

      # Screenshot comparisons (@pixel) run in the macOS job below: their baselines are macOS
      # Chromium renders, and Linux font rendering differs by 1-2 %.
      - name: Playwright e2e without @pixel (ircd, runner with the Fake_Agent, Next production build)
        run: pnpm --filter @seance/web test:e2e:functional

      - name: Web bundle test (fixture code only in the e2e build)
        run: pnpm --filter @seance/web exec vitest run src/fixtures/bundle.test.ts
        env:
          CI: "true"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            apps/web/test-results
            apps/web/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Static checks of the deployment files (spec deploy-aws). No AWS credentials exist in this job:
  # terraform runs fmt, init without a backend and validate only, never plan or apply.
  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_SESSION_TOKEN: ""
      AWS_EC2_METADATA_DISABLED: "true"
      TF_IN_AUTOMATION: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: shellcheck deploy/*.sh
        run: shellcheck --severity=style deploy/*.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: infra
        run: terraform fmt -check -recursive -diff

      - name: terraform init -backend=false
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra
        run: terraform validate

  # Screenshot comparisons against the macOS Chromium baselines and the Figma exports (tests tagged
  # @pixel in apps/web/e2e/pixel.spec.ts). Same thresholds and baselines as a local run.
  pixel:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SEANCE_E2E_KIRO: "0"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # pnpm version comes from "packageManager": "pnpm@11.7.0" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js (version from .nvmrc) with the pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @seance/web exec playwright install chromium

      - name: Playwright screenshot comparisons (@pixel)
        run: pnpm --filter @seance/web test:e2e:pixel

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pixel-results
          path: |
            apps/web/test-results
            apps/web/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
